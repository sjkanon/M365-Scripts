name: Sync Fork with Upstream

on:
  schedule:
    - cron: '0 6 * * *'   # Daily at 06:00 UTC
  workflow_dispatch:        # Allow manual trigger

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_GITHUB }}

      - name: Sync with upstream
        run: |
          git config user.name "github@first.eu"
          git config user.email "github@first.eu"
          git remote add upstream https://github.com/sjkanon/M365-Scripts.git
          git fetch upstream
          git checkout main
          git merge upstream/main --ff-only
          git push https://x-access-token:${{ secrets.PAT_GITHUB }}@github.com/${{ github.repository }}.git main
