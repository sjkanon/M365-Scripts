# The same checks the local hooks run (.claude/hooks/sync-docs.ps1, .githooks/pre-commit),
# here for every push and PR - so a commit made without the hooks, or from the GitHub web
# editor, is still checked before it reaches main. Nothing in this repository is executed:
# scripts are parsed and linted, readmes are checked, that is all.
name: CI

on:
  push:
    branches: [devel, main]
  pull_request:
    branches: [devel, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  powershell:
    name: PowerShell 7 - syntax and analyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Syntax
        shell: pwsh
        run: ./scripts/Startup/Test-PowerShellSyntax.ps1 -Recurse -IncludePsm1

      # Errors only: warnings would bury the real problems. The plaintext SecureString rule is
      # left out - the break-glass and user-creation scripts generate a password on purpose.
      - name: PSScriptAnalyzer (errors)
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
              Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
          $found = @(Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error `
                       -ExcludeRule PSAvoidUsingConvertToSecureStringWithPlainText)
          foreach ($f in $found) {
              $file = [IO.Path]::GetRelativePath($PWD, $f.ScriptPath)
              Write-Host "::error file=$file,line=$($f.Line),title=$($f.RuleName)::$($f.Message)"
          }
          if ($found.Count) { exit 1 }
          Write-Host 'No analyzer errors.'

  # Windows PowerShell 5.1 reads a .ps1 without BOM as ANSI, so a "—" or "é" in a UTF-8 file
  # becomes a stray quote and the script no longer parses. PowerShell 7 does not have this
  # problem, which is why it goes unnoticed - until the script runs on a device through Intune,
  # a GPO or a scheduled task. The cure is saving the file as UTF-8 with BOM.
# Scripts with #Requires -Version 7 are skipped.
  windows-powershell:
    name: Windows PowerShell 5.1 - syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Syntax (5.1)
        shell: powershell
        run: |
          $root = (Get-Location).Path
          $bad = 0
          Get-ChildItem -Recurse -File | Where-Object { $_.Extension -in '.ps1', '.psm1' } | ForEach-Object {
              if ((Get-Content -LiteralPath $_.FullName -TotalCount 40) -match '^#Requires\s+-Version\s+7') { return }
              $errors = $null; $tokens = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
              if ($errors) {
                  $bad++
                  $file = $_.FullName.Substring($root.Length + 1) -replace '\\', '/'
                  $e = $errors[0]
                  Write-Host "::error file=$file,line=$($e.Extent.StartLineNumber),title=Does not parse in Windows PowerShell 5.1::$($e.Message)"
              }
          }
          if ($bad) { Write-Host "$bad file(s) do not parse in Windows PowerShell 5.1."; exit 1 }
          Write-Host 'Every script parses in Windows PowerShell 5.1.'

  docs:
    name: Readmes - links, headers, index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Markdown links
        shell: pwsh
        run: ./scripts/Startup/Test-MarkdownLinks.ps1

      # Fails when a folder misses its readme.nl.md / readme.fr.md.
      - name: Readme headers and languages
        shell: pwsh
        run: ./scripts/Startup/Update-ReadmeHeader.ps1

      - name: Script index
        shell: pwsh
        run: ./scripts/Startup/Update-ScriptIndex.ps1

      # The generators above rewrite files; any difference means the commit was made
      # without the pre-commit hook and the generated docs are stale.
      - name: Generated files are up to date
        shell: bash
        run: |
          if ! git diff --exit-code --stat; then
              echo '::error::scripts/INDEX.md or a readme header is out of date. Run scripts/Startup/Update-ScriptIndex.ps1 and Update-ReadmeHeader.ps1 and commit the result.'
              git diff | head -100
              exit 1
          fi

  shell:
    name: Shell scripts - ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: bash -n and ShellCheck
        shell: bash
        run: |
          mapfile -t files < <(git ls-files '*.sh')
          if ((${#files[@]} == 0)); then echo 'No shell scripts.'; exit 0; fi
          for f in "${files[@]}"; do bash -n "$f"; done
          shellcheck --version | head -2
          shellcheck -S warning -f gcc "${files[@]}" | sed -E 's/^([^:]+):([0-9]+):([0-9]+): (warning|error): (.*)$/::\4 file=\1,line=\2,col=\3::\5/'
          exit "${PIPESTATUS[0]}"
