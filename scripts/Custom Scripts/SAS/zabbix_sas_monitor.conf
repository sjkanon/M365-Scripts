# Zabbix UserParameter configuration for SAS batch error monitoring
# Place this file in: C:\Program Files\Zabbix Agent 2\zabbix_agent2.d\

# Check for critical SAS batch errors (last 7 days)
UserParameter=sas.batch.errors.critical,powershell -NoProfile -ExecutionPolicy Bypass -File "C:\Scripts\Monitor-SASBatchErrors.ps1" -LogDirectory "E:\SAS\Logs" -DaysToCheck 7 -OutputFormat Zabbix

# Check for critical errors in last 24 hours
UserParameter=sas.batch.errors.critical.24h,powershell -NoProfile -ExecutionPolicy Bypass -File "C:\Scripts\Monitor-SASBatchErrors.ps1" -LogDirectory "E:\SAS\Logs" -DaysToCheck 1 -OutputFormat Zabbix

# Get full JSON report (for Zabbix trapper or manual review)
UserParameter=sas.batch.errors.json,powershell -NoProfile -ExecutionPolicy Bypass -File "C:\Scripts\Monitor-SASBatchErrors.ps1" -LogDirectory "E:\SAS\Logs" -DaysToCheck 7 -OutputFormat JSON

# Get text report for manual review
UserParameter=sas.batch.errors.report,powershell -NoProfile -ExecutionPolicy Bypass -File "C:\Scripts\Monitor-SASBatchErrors.ps1" -LogDirectory "E:\SAS\Logs" -DaysToCheck 7 -OutputFormat Text
